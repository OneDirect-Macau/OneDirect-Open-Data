<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-label="OneDirect Open Data banner">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#EEF3F1" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#071015" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="28" fill="#101B22"/>
  <rect width="1600" height="520" rx="28" fill="url(#grid)"/>

  <path d="M65 426 C240 344 402 442 585 358 C778 270 930 364 1128 254 C1282 168 1410 198 1540 128"
        fill="none" stroke="#2E8B57" stroke-width="8" stroke-linecap="round"/>
  <g fill="#F7F4EC">
    <circle cx="65" cy="426" r="12"/>
    <circle cx="585" cy="358" r="12"/>
    <circle cx="1128" cy="254" r="12"/>
  </g>

  <g transform="translate(65 54)">
    <rect width="54" height="54" rx="12" fill="#E4572E"/>
    <text x="27" y="35" text-anchor="middle"
          font-family="Segoe UI, PingFang TC, Microsoft JhengHei, sans-serif"
          font-size="18" font-weight="800" fill="#FFFFFF">OD</text>
    <text x="72" y="36"
          font-family="Segoe UI, PingFang TC, Microsoft JhengHei, sans-serif"
          font-size="22" font-weight="700" letter-spacing="2"
          fill="#F7F4EC">ONEDIRECT · OPEN DATA</text>
  </g>

  <text x="65" y="225"
        font-family="Segoe UI, PingFang TC, Microsoft JhengHei, sans-serif"
        font-size="92" font-weight="850" letter-spacing="-3"
        fill="#FFFFFF">MACAU TRANSIT</text>
  <text x="65" y="307"
        font-family="Segoe UI, PingFang TC, Microsoft JhengHei, sans-serif"
        font-size="92" font-weight="850" letter-spacing="-3"
        fill="#FFFFFF">DATA COLLECTION</text>
  <text x="68" y="360"
        font-family="Segoe UI, PingFang TC, Microsoft JhengHei, sans-serif"
        font-size="23" font-weight="500"
        fill="#B9C9C3">Public bus and LRT routes, stops, directions, schedules and geometry.</text>

  <g font-family="Segoe UI, PingFang TC, Microsoft JhengHei, sans-serif">
    <rect x="68" y="400" width="142" height="42" rx="21" fill="#1D313B" stroke="#36504F"/>
    <text x="139" y="427" text-anchor="middle" font-size="16" font-weight="700"
          fill="#DDE9E4">91 Routes</text>
    <rect x="222" y="400" width="154" height="42" rx="21" fill="#1D313B" stroke="#36504F"/>
    <text x="299" y="427" text-anchor="middle" font-size="16" font-weight="700"
          fill="#DDE9E4">586 Stops</text>
    <rect x="388" y="400" width="196" height="42" rx="21" fill="#1D313B" stroke="#36504F"/>
    <text x="486" y="427" text-anchor="middle" font-size="16" font-weight="700"
          fill="#DDE9E4">950 Schedule Rows</text>
  </g>

  <g transform="translate(895 64)" filter="url(#shadow)">
    <rect width="640" height="390" rx="22" fill="#16262E" stroke="#2D4650"/>
    <text x="28" y="44"
          font-family="Segoe UI, PingFang TC, Microsoft JhengHei, sans-serif"
          font-size="15" font-weight="800" letter-spacing="2"
          fill="#8FA59D">DATASET SNAPSHOT</text>

    <g transform="translate(28 72)">
      <rect width="286" height="130" rx="16" fill="#21353D"/>
      <rect x="18" y="18" width="48" height="48" rx="12" fill="#E4572E"/>
      <text x="42" y="49" text-anchor="middle" font-family="Segoe UI, sans-serif"
            font-size="16" font-weight="800" fill="#FFFFFF">01</text>
      <text x="82" y="42"
            font-family="Segoe UI, PingFang TC, Microsoft JhengHei, sans-serif"
            font-size="22" font-weight="750" fill="#FFFFFF">Bus routes</text>
      <text x="82" y="70"
            font-family="Segoe UI, PingFang TC, Microsoft JhengHei, sans-serif"
            font-size="14" fill="#B9C9C3">91 real route records</text>
      <text x="82" y="92"
            font-family="Segoe UI, PingFang TC, Microsoft JhengHei, sans-serif"
            font-size="14" fill="#B9C9C3">Bilingual names and agencies</text>
    </g>

    <g transform="translate(328 72)">
      <rect width="284" height="130" rx="16" fill="#21353D"/>
      <rect x="18" y="18" width="48" height="48" rx="12" fill="#2578B8"/>
      <text x="42" y="49" text-anchor="middle" font-family="Segoe UI, sans-serif"
            font-size="16" font-weight="800" fill="#FFFFFF">02</text>
      <text x="82" y="42"
            font-family="Segoe UI, PingFang TC, Microsoft JhengHei, sans-serif"
            font-size="22" font-weight="750" fill="#FFFFFF">Stops</text>
      <text x="82" y="70"
            font-family="Segoe UI, PingFang TC, Microsoft JhengHei, sans-serif"
            font-size="14" fill="#B9C9C3">586 platform-level stops</text>
      <text x="82" y="92"
            font-family="Segoe UI, PingFang TC, Microsoft JhengHei, sans-serif"
            font-size="14" fill="#B9C9C3">Coordinates and parent IDs</text>
    </g>

    <g transform="translate(28 218)">
      <rect width="286" height="140" rx="16" fill="#21353D"/>
      <rect x="18" y="18" width="48" height="48" rx="12" fill="#D39A28"/>
      <text x="42" y="49" text-anchor="middle" font-family="Segoe UI, sans-serif"
            font-size="16" font-weight="800" fill="#FFFFFF">03</text>
      <text x="82" y="42"
            font-family="Segoe UI, PingFang TC, Microsoft JhengHei, sans-serif"
            font-size="22" font-weight="750" fill="#FFFFFF">Schedules</text>
      <text x="82" y="70"
            font-family="Segoe UI, PingFang TC, Microsoft JhengHei, sans-serif"
            font-size="14" fill="#B9C9C3">950 direction-specific rows</text>
      <text x="82" y="92"
            font-family="Segoe UI, PingFang TC, Microsoft JhengHei, sans-serif"
            font-size="14" fill="#B9C9C3">Weekday, weekend and holiday</text>
    </g>

    <g transform="translate(328 218)">
      <rect width="284" height="140" rx="16" fill="#21353D"/>
      <rect x="18" y="18" width="48" height="48" rx="12" fill="#2E8B57"/>
      <text x="42" y="49" text-anchor="middle" font-family="Segoe UI, sans-serif"
            font-size="16" font-weight="800" fill="#FFFFFF">04</text>
      <text x="82" y="42"
            font-family="Segoe UI, PingFang TC, Microsoft JhengHei, sans-serif"
            font-size="22" font-weight="750" fill="#FFFFFF">Geometry</text>
      <text x="82" y="70"
            font-family="Segoe UI, PingFang TC, Microsoft JhengHei, sans-serif"
            font-size="14" fill="#B9C9C3">115 route directions</text>
      <text x="82" y="92"
            font-family="Segoe UI, PingFang TC, Microsoft JhengHei, sans-serif"
            font-size="14" fill="#B9C9C3">GeoJSON LineString paths</text>
    </g>
  </g>
</svg>
